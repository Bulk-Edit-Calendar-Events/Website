  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    (function () {
      var API_URL = 'https://server.bulkeditcalendarevents.com/api/incidents';

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
      }

      function renderMarkdown(text) {
        if (!text) return '';
        if (typeof marked !== 'undefined' && marked.parse) {
          var raw = marked.parse(text);
          return typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(raw) : escapeHtml(text);
        }
        return '<p>' + escapeHtml(text) + '</p>';
      }

      function formatDate(dateStr) {
        if (!dateStr) return '';
        return new Date(dateStr).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      }

      function renderIncident(incident) {
        var statusClass = incident.status || 'active';
        var html = '<div class="incident-card ' + statusClass + '">';
        html += '<h3>' + escapeHtml(incident.title);
        html += ' <span class="incident-status ' + statusClass + '">' + escapeHtml(incident.status) + '</span>';
        html += '</h3>';

        var dates = '';
        if (incident.startedAt) dates += 'Started: ' + formatDate(incident.startedAt);
        if (incident.resolvedAt) dates += (dates ? ' &middot; ' : '') + 'Resolved: ' + formatDate(incident.resolvedAt);
        if (dates) html += '<p style="font-size:0.85rem;color:#ccc;margin:0 0 0.5rem;">' + dates + '</p>';

        html += '<p class="incident-section-label">Description</p>';
        html += '<div class="incident-description">' + renderMarkdown(incident.description) + '</div>';

        if (incident.cause) {
          html += '<p class="incident-section-label">Cause</p>';
          html += '<div class="incident-description">' + renderMarkdown(incident.cause) + '</div>';
        }

        if (incident.workaround) {
          html += '<p class="incident-section-label">Workaround</p>';
          html += '<div class="incident-description">' + renderMarkdown(incident.workaround) + '</div>';
        }

        if (incident.versionsAffected && incident.versionsAffected.length > 0) {
          html += '<p class="incident-section-label">Versions Affected</p>';
          html += '<div class="incident-versions">';
          incident.versionsAffected.forEach(function (v) {
            html += '<span>' + escapeHtml(v) + '</span>';
          });
          html += '</div>';
        }

        html += '</div>';
        return html;
      }

      fetch(API_URL)
        .then(function (res) { return res.json(); })
        .then(function (incidents) {
          document.getElementById('incidents-loading').style.display = 'none';

          if (!incidents || incidents.length === 0) {
            document.getElementById('no-incidents').style.display = 'block';
            return;
          }

          var container = document.getElementById('incidents-container');
          var html = '';
          incidents.forEach(function (incident) {
            html += renderIncident(incident);
          });
          container.innerHTML = html;
        })
        .catch(function () {
          document.getElementById('incidents-loading').textContent = 'Unable to load incidents. Please try again later.';
        });
    })();
  </script>
